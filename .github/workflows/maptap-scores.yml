name: MapTap scores

on:
  schedule:
    # Every six hours. Empty backend.json url exits cleanly.
    - cron: "15 */6 * * *"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared scores into scores.json
        run: python3 scripts/sync-maptap-scores.py

      - name: Commit scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boyzmaptap/scores.json
          if git diff --cached --quiet; then
            echo "No score changes."
            exit 0
          fi
          git commit -m "Sync MapTap scores from the shared board"
          git push
