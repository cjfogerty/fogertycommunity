<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. Louis Metro Church Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#1c1917; --muted:#57534e; --paper:#faf7f2; --line:#e7e0d6; --accent:#7c2d12; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; font-family: Georgia, serif; color:var(--ink); background:var(--paper); }
    body { display:grid; grid-template-rows:auto 1fr; }
    header { padding:10px 16px 12px; border-bottom:1px solid var(--line); background:#fff; }
    header h1 { margin:0; font-size:18px; }
    header .lede { margin:2px 0 10px; font-size:12px; color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:end; font-family:ui-sans-serif,system-ui,sans-serif; font-size:12px; }
    .controls label { display:flex; flex-direction:column; gap:3px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
    select, button { font:13px ui-sans-serif,system-ui,sans-serif; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; color:var(--ink); }
    button { cursor:pointer; }
    button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .layout { display:grid; grid-template-columns:1fr 340px; min-height:0; }
    #map { min-height:0; }
    aside { overflow:auto; border-left:1px solid var(--line); background:#fff; padding:14px 16px 28px; font-family:ui-sans-serif,system-ui,sans-serif; font-size:13px; }
    aside h2 { font-size:15px; margin:0 0 6px; font-family:Georgia,serif; }
    .statgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 14px; }
    .stat { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
    .stat b { display:block; font-size:16px; }
    .stat span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { text-align:left; padding:5px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:10px; text-transform:uppercase; }
    a { color:var(--accent); }
    .note { color:var(--muted); font-size:11px; line-height:1.45; margin-top:12px; }
    .legend { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
    .swatch { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
    .swatch i { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .pin { width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.28); background:#7c2d12 center/18px no-repeat; display:block; }
    @media (max-width:860px) { .layout { grid-template-columns:1fr; grid-template-rows:52vh auto; } aside { border-left:0; border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <h1>St. Louis metro church map</h1>
    <p class="lede">Click a marker or zip. Filters hide campuses; zip share uses only what is visible.</p>
    <div class="controls">
      <label>Faith
        <select id="filterFaith"><option value="all">All faiths</option></select>
      </label>
      <label>Denomination
        <select id="filterDenom"><option value="all">All denominations</option></select>
      </label>
      <label>Size
        <select id="filterSize">
          <option value="all">All sizes</option>
          <option value="micro">Micro under 100</option>
          <option value="small">Small 100-399</option>
          <option value="mid">Mid 400-999</option>
          <option value="large">Large 1,000-2,499</option>
          <option value="mega">Mega 2,500+</option>
        </select>
      </label>
      <label>Focus church
        <select id="focus"></select>
      </label>
      <button type="button" id="toggleZips" class="active">Zip layer</button>
      <button type="button" id="toggleShare" class="active">Color by share</button>
      <button type="button" id="resetFilters">Reset</button>
    </div>
  </header>
  <div class="layout">
    <div id="map"></div>
    <aside>
      <h2>How to read this</h2>
      <p>Markers are campuses. Size tracks weekly attendance. Faith is the broad tradition. Denomination is the family. Size is campus weekly, not the whole multi-site org.</p>
      <div class="legend" id="legend"></div>
      <div id="detail"></div>
    </aside>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map-app.js"></script>
</body>
</html>
