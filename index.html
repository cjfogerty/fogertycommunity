<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="cache-control" content="no-cache" />
  <title>Fogerty U5 Soccer Team</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif; background: #06140c;
      background-image: linear-gradient(to bottom, rgba(6,20,12,0.85), rgba(6,20,12,0.95)),
        url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1920&q=80");
      background-size: cover; background-position: center;
    }
    .card { width: min(420px, 92vw); padding: 2.25rem 2rem; background: rgba(255,255,255,0.97);
      border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 1.6rem; color: #14532d; }
    p { color: #475569; line-height: 1.5; margin: 0 0 1.1rem; }
    input[type="password"] { width: 100%; box-sizing: border-box; padding: 0.85rem 0.9rem;
      border: 1px solid #d1d5db; border-radius: 0.8rem; font-size: 16px; margin-bottom: 0.85rem; }
    button { width: 100%; border: 0; border-radius: 0.8rem; padding: 0.9rem; background: #16a34a;
      color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; }
    label { display: flex; align-items: center; gap: 0.55rem; color: #64748b; font-size: 0.9rem; margin: 0 0 0.9rem; }
    .err { color: #b91c1c; font-size: 0.85rem; min-height: 1.2em; margin: 0 0 0.5rem; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚽ Fogerty U5 Soccer Team</h1>
    <p>Enter the team passphrase to view the schedule and resources.</p>
    <form id="f">
      <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus />
      <label><input id="remember" type="checkbox" checked /> Remember me</label>
      <div class="err" id="err"></div>
      <button type="submit">Enter</button>
    </form>
    <p class="hint">O’Fallon Parks & Rec · Fall 2026</p>
  </div>
  <script>
    const SALT_HEX = "f2f923d9f41bdf092b2c50e40e3b176a";
    const KEY_NAME = "fogerty_u5_passphrase_v2";
    const HIST_ENC_URL = "https://raw.githubusercontent.com/cjfogerty/fogertycommunity/f0143162de87399474e04715089e32298caee129/team-page.enc";
    const CLAIMS = [
      { date: "Sat, Sept 26, 2026", name: "Anna Lambert (Madelyn)" },
      { date: "Sat, Oct 3, 2026", name: "Amanda Connors" }
    ];
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }
    function looksLikePayload(text) {
      const t = (text || "").trim();
      return t.length > 200 && /^[A-Za-z0-9+/=\s]+$/.test(t);
    }
    async function fetchText(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("missing " + url);
      return r.text();
    }
    async function loadPayload() {
      try {
        const parts = await Promise.all([
          fetchText("team-page.enc.part1"),
          fetchText("team-page.enc.part2"),
          fetchText("team-page.enc.part3")
        ]);
        const joined = parts.join("");
        if (looksLikePayload(joined)) return joined;
      } catch (e) {}
      try {
        const single = await fetchText("team-page.enc");
        if (looksLikePayload(single)) return single;
      } catch (e) {}
      return fetchText(HIST_ENC_URL);
    }
    async function deriveKey(password) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: hexToBytes(SALT_HEX), iterations: 200000, hash: "SHA-256" },
        material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }
    async function unlock(password, payload) {
      const key = await deriveKey(password);
      const raw = b64ToBytes(payload.trim());
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
      return new TextDecoder().decode(plainBuf);
    }
    const STATUSFY_DROPDOWN =
      '<details class="statusfy-drop rounded-2xl bg-pitch-50 border border-pitch-100">' +
        '<summary class="statusfy-summary p-4 hover:bg-pitch-100">' +
          '<div>' +
            '<p class="font-semibold text-pitch-950">Field Status / Rainouts</p>' +
            '<p class="text-sm text-pitch-600">Statusfy · Sports Park · <span id="statusfy-summary">tap to check fields</span></p>' +
          '</div>' +
          '<span class="statusfy-chevron text-pitch-400" aria-hidden="true">▾</span>' +
        '</summary>' +
        '<div class="statusfy-panel">' +
          '<div id="statusfy-fields"></div>' +
        '</div>' +
      '</details>';
    function applyStatusfy(html) {
      const pattern = /<a[^>]+href="https?:\/\/statusfy\.com\/6363339900\/?"[^>]*>[\s\S]*?<\/a>/i;
      if (!pattern.test(html)) return html;
      html = html.replace(pattern, STATUSFY_DROPDOWN);
      if (html.indexOf("statusfy-fields.js") === -1) {
        html = html.replace(/<\/body>/i, '<script src="statusfy-fields.js"><\/script>\n</body>');
      }
      return html;
    }
    function applyClaims(html) {
      CLAIMS.forEach(function (claim) {
        const pattern = new RegExp(
          '<button type="button" class="claim-btn[^"]*"' +
          '[^>]*\\bdata-date="' + claim.date.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '"' +
          '[^>]*>\\s*Claim snack\\s*</button>',
          "i"
        );
        html = html.replace(pattern, '<span class="font-semibold text-pitch-800">' + claim.name + "</span>");
      });
      return applyStatusfy(html);
    }
    async function tryPassword(password, remember) {
      const payload = await loadPayload();
      if (!looksLikePayload(payload)) throw new Error("missing payload");
      const html = applyClaims(await unlock(password, payload));
      if (remember) sessionStorage.setItem(KEY_NAME, password);
      else sessionStorage.removeItem(KEY_NAME);
      document.open(); document.write(html); document.close();
    }
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      try {
        await tryPassword(document.getElementById("pw").value, document.getElementById("remember").checked);
      } catch (ex) {
        err.textContent = "That passphrase didn’t work. Try again.";
      }
    });
    (async () => {
      const saved = sessionStorage.getItem(KEY_NAME);
      if (!saved) return;
      try { await tryPassword(saved, true); } catch (e) { sessionStorage.removeItem(KEY_NAME); }
    })();
  </script>
</body>
</html>
