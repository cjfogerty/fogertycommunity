<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Buffalo Maroonicorns · Fall 2026</title>
  <meta name="theme-color" content="#721f2c" />
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;color:#721f2c">Loading team page…</p>
  <script>
    (async function () {
      var SOURCE = '68e41da7559334fc3a7d49249ce083e8cbbb3763';
      var urls = [
        'https://cdn.jsdelivr.net/gh/cjfogerty/fogertycommunity@' + SOURCE + '/index.html',
        'https://raw.githubusercontent.com/cjfogerty/fogertycommunity/' + SOURCE + '/index.html'
      ];
      var html = null;
      for (var i = 0; i < urls.length && !html; i++) {
        try {
          var res = await fetch(urls[i]);
          if (res.ok) html = await res.text();
        } catch (e) {}
      }
      if (!html) {
        document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load the team page. Try a refresh.</p>';
        return;
      }

      var nextUp = {
        mode: 'practice',
        badge: 'Practice',
        badge2: 'Field 8C',
        title: 'Wednesday, October 1',
        when: '5:30–6:00 PM · Field 8C',
        note: 'Sports Park · 3589 Hwy K, O’Fallon. Next game is Saturday, Oct 3, 9:00 AM Field 8B vs Need Coach 2 (Away). Snack: Amanda Connors.',
        mapHighlight: '8C',
        mapLabel: 'Practice tonight · Field 8C',
        mapSub: 'Wed 5:30–6:00 PM · pinch or use + / −'
      };
      try {
        var nu = await fetch('next-up.json?v=' + Date.now());
        if (nu.ok) nextUp = Object.assign(nextUp, await nu.json());
      } catch (e) {}

      var style = '\n    .park-map{width:100%;height:auto;display:block}\n    .park-map-open{position:relative;display:block;width:100%;padding:0;border:0;background:#e8eef2;cursor:zoom-in}\n    .park-map-open:focus-visible{outline:3px solid #721f2c;outline-offset:2px}\n    .park-map-hint{position:absolute;right:10px;bottom:10px;z-index:2;border-radius:999px;background:rgba(114,31,44,.92);color:#f6efe6;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 10px;box-shadow:0 6px 16px rgba(45,12,19,.25)}\n    .park-map-dialog{padding:0;border:0;width:100vw;max-width:100vw;height:100vh;max-height:100vh;background:#14080b}\n    .park-map-dialog::backdrop{background:rgba(20,8,11,.72)}\n    .park-map-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#721f2c;color:#f6efe6}\n    .park-map-bar p{margin:0;font-size:13px;font-weight:700}\n    .park-map-bar .sub{display:block;font-size:10px;font-weight:600;opacity:.8}\n    .park-map-tools{display:flex;gap:6px}\n    .park-map-tools button{min-width:36px;height:36px;border:0;border-radius:10px;background:#f6efe6;color:#721f2c;font-size:18px;font-weight:800;cursor:pointer}\n    .park-map-tools [data-map-close]{background:#2d0c13;color:#f6efe6;font-size:13px;padding:0 10px}\n    .park-map-stage{height:calc(100vh - 56px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#0f1c24}\n    .park-map-stage img{display:block;width:160%;max-width:none;height:auto;margin:0 auto;transform-origin:center top}\n    #schedule tr.past-game{display:none}\n    #schedule tr.past-game.is-open{display:table-row}\n    #schedule .past-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:#721f2c}\n    #schedule .past-toggle-btn .chev{display:inline-block;transition:transform .15s ease}\n    #schedule .past-toggle-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}\n';
      html = html.replace('  </style>', style + '  </style>');

      html = html.replace('Jerseys handed out', 'Wednesday');
      html = html.replace('Wear your jersey Saturday', 'See you at practice on Wednesday!');
      html = html.replace(
        'Jerseys and socks were handed out at Wednesday practice. Wear the jersey for Saturday’s first game.',
        'Why did the soccer player bring string to practice? So they could tie the score!'
      );

      var isPractice = nextUp.mode === 'practice';
      var badges = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-100 text-pitch-800">' + nextUp.badge + '</span>';
      if (nextUp.badge2) {
        badges += '\n            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-800 text-cream">' + nextUp.badge2 + '</span>';
      }
      html = html.replace(
        '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-100 text-pitch-800">Game</span>\n            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-800 text-cream">Home</span>',
        badges
      );
      html = html.replace('Saturday, September 12', nextUp.title);
      html = html.replace('9:00 AM · Field 8B · vs Need Coach 1', nextUp.when);
      var marker = 'Season opener. Wear your jersey. Snack: Alyssa Fogerty. Next practice is Wednesday, Sept 16, 5:30–6:00 PM on Field 8C.</p>';
      var highlightName = nextUp.mapHighlight === '8C' ? 'Practice Field 8C' : 'Game Field 8B';
      var block = nextUp.note + '</p>\n        </div>\n      </div>\n      <div class="mt-5 pt-5 border-t border-pitch-100">\n        <div class="flex flex-wrap items-end justify-between gap-2 mb-3">\n          <div>\n            <h3 class="font-display text-lg font-bold text-pitch-900">Where to go</h3>\n            <p class="text-sm text-slate-600">Sports Park · 3589 Hwy K, O’Fallon. ' + highlightName + ' is highlighted.</p>\n          </div>\n          <a href="https://maps.google.com/?q=3589+Hwy+K,+O\'Fallon,+MO+63368" target="_blank" rel="noopener" class="text-xs font-semibold text-pitch-700 underline">Open in Maps →</a>\n        </div>\n        <button type="button" class="park-map-open rounded-2xl overflow-hidden border border-pitch-200" data-open-map aria-haspopup="dialog" aria-controls="park-map-dialog">\n          <img src="park-map.svg?v=' + (nextUp.updated || '8') + '" alt="Sports Park map. Tap to expand." class="park-map w-full h-auto">\n          <span class="park-map-hint">Tap to expand</span>\n        </button>\n        <p class="text-xs text-slate-500 mt-3 leading-relaxed">Turn in off Highway K. Follow the main drive past the South Fields, cross the creek, and park at the North Fields lot (P just south of Field 8). Field 8B is the east half of Field 8. Practice strip 8C sits on the south edge of Field 8.</p>\n      </div>';
      if (html.indexOf(marker) !== -1) html = html.replace(marker, block);

      html = html.replace('Campos <span class="text-xs text-amber-600">(Picture Day)</span>', 'Campos');
      html = html.replace(
        '\n        <a href="https://drive.google.com/file/d/1V0PlHwwObGR5qA7vs1iw8YxXoEmUx1Br/view" target="_blank" rel="noopener" class="flex items-center justify-between p-4 rounded-2xl bg-pitch-50 hover:bg-pitch-100 border border-pitch-100">\n          <div><p class="font-semibold text-pitch-950">Picture Day Order Form</p><p class="text-sm text-pitch-600">September 26</p></div><span class="text-pitch-400">→</span>\n        </a>',
        ''
      );

      var extras = '\n<dialog id="park-map-dialog" class="park-map-dialog">\n  <div class="park-map-bar">\n    <p>' + nextUp.mapLabel + '<span class="sub">' + nextUp.mapSub + '</span></p>\n    <div class="park-map-tools">\n      <button type="button" data-map-zoom="-1" aria-label="Zoom out">−</button>\n      <button type="button" data-map-zoom="1" aria-label="Zoom in">+</button>\n      <button type="button" data-map-close>Close</button>\n    </div>\n  </div>\n  <div class="park-map-stage" id="park-map-stage">\n    <img id="park-map-large" src="park-map.svg?v=' + (nextUp.updated || '8') + '" alt="Expanded Sports Park map">\n  </div>\n</dialog>\n<script>\n(function () {\n  var dialog = document.getElementById("park-map-dialog");\n  var stage = document.getElementById("park-map-stage");\n  var img = document.getElementById("park-map-large");\n  var zoom = 1.6;\n  function applyZoom() {\n    img.style.width = (zoom * 100) + "%";\n  }\n  function openMap() {\n    applyZoom();\n    if (dialog.showModal) dialog.showModal();\n    else dialog.setAttribute("open", "");\n    requestAnimationFrame(function () {\n      var x = Math.max(0, (img.clientWidth * 0.34) - (stage.clientWidth / 2));\n      var y = Math.max(0, (img.clientHeight * 0.28) - 40);\n      stage.scrollTo(x, y);\n    });\n  }\n  function closeMap() {\n    if (dialog.close) dialog.close();\n    else dialog.removeAttribute("open");\n  }\n  document.querySelectorAll("[data-open-map]").forEach(function (el) {\n    el.addEventListener("click", openMap);\n  });\n  document.querySelectorAll("[data-map-close]").forEach(function (el) {\n    el.addEventListener("click", closeMap);\n  });\n  document.querySelectorAll("[data-map-zoom]").forEach(function (el) {\n    el.addEventListener("click", function () {\n      zoom = Math.min(3.2, Math.max(1, zoom + Number(el.getAttribute("data-map-zoom")) * 0.35));\n      applyZoom();\n    });\n  });\n  dialog.addEventListener("click", function (e) {\n    if (e.target === dialog) closeMap();\n  });\n  document.addEventListener("keydown", function (e) {\n    if (e.key === "Escape") closeMap();\n  });\n  (function collapsePastGames() {\n    var table = document.querySelector("#schedule table");\n    if (!table) return;\n    var tbody = table.querySelector("tbody");\n    if (!tbody) return;\n    var now = new Date();\n    var today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");\n    var rows = Array.prototype.slice.call(tbody.querySelectorAll("tr"));\n    var past = [];\n    rows.forEach(function (tr) {\n      var cell = tr.querySelector("[data-iso]");\n      if (!cell) return;\n      var iso = cell.getAttribute("data-iso");\n      if (iso && iso < today) {\n        tr.classList.add("past-game");\n        past.push(tr);\n      }\n    });\n    if (!past.length) return;\n    var toggleRow = document.createElement("tr");\n    toggleRow.className = "bg-pitch-50";\n    var td = document.createElement("td");\n    td.colSpan = 5;\n    td.className = "px-2 sm:px-3 py-3";\n    var btn = document.createElement("button");\n    btn.type = "button";\n    btn.className = "past-toggle-btn";\n    btn.setAttribute("aria-expanded", "false");\n    var text = document.createElement("span");\n    text.className = "font-semibold";\n    var chev = document.createElement("span");\n    chev.className = "chev text-pitch-400";\n    chev.setAttribute("aria-hidden", "true");\n    chev.textContent = "▾";\n    btn.appendChild(text);\n    btn.appendChild(chev);\n    function label(open) {\n      text.textContent = (open ? "Hide past games" : "Past games") + " · " + past.length;\n    }\n    label(false);\n    btn.addEventListener("click", function () {\n      var open = btn.getAttribute("aria-expanded") !== "true";\n      btn.setAttribute("aria-expanded", open ? "true" : "false");\n      past.forEach(function (tr) {\n        if (open) tr.classList.add("is-open");\n        else tr.classList.remove("is-open");\n      });\n      label(open);\n    });\n    td.appendChild(btn);\n    toggleRow.appendChild(td);\n    tbody.insertBefore(toggleRow, tbody.firstChild);\n  })();\n})();\n<\\/script>\n';
      html = html.replace('</body>', extras + '</body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
