<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fogerty U5 Soccer Team</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #06140c;
      background-image: linear-gradient(to bottom, rgba(6,20,12,0.85), rgba(6,20,12,0.95)),
        url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-position: center;
      color: #14532d;
    }
    .card {
      max-width: 420px; width: 90%; padding: 2.5rem;
      background: rgba(255,255,255,0.97); border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); text-align: center;
    }
    h1 { margin: 0 0 1rem; font-size: 1.75rem; font-weight: 800; }
    p { color: #475569; line-height: 1.5; margin: 0 0 1.25rem; }
    code { background: #f1f5f9; padding: 0.2rem 0.45rem; border-radius: 0.35rem; font-size: 0.9em; }
    a { color: #16a34a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚽ Fogerty U5 Soccer</h1>
    <p>The password-protected team page is being updated with analytics.</p>
    <p>Please check back in a few minutes, or contact Coach Casey if you need the schedule right away.</p>
    <p style="font-size:0.85rem;color:#94a3b8;margin-top:1.5rem;">O’Fallon Parks & Rec · Fall 2026</p>
  </div>
</body>
</html>
