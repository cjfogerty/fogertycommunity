<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Buffalo Maroonicorns · Fall 2026</title>
  <meta name="theme-color" content="#721f2c" />
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;color:#721f2c">Loading team page…</p>
  <script>
    (async function () {
      var urls = [
        'https://cdn.jsdelivr.net/gh/cjfogerty/fogertycommunity@68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html',
        'https://raw.githubusercontent.com/cjfogerty/fogertycommunity/68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html'
      ];
      var html = null;
      for (var i = 0; i < urls.length && !html; i++) {
        try {
          var res = await fetch(urls[i]);
          if (res.ok) html = await res.text();
        } catch (e) {}
      }
      if (!html) {
        document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load the team page. Try a refresh.</p>';
        return;
      }
      var style = '\n    .park-map{width:100%;height:auto;display:block}\n    .park-map .field-pitch{fill:#f7f4ee;stroke:#8a8f7a;stroke-width:1.2}\n    .park-map .field-lines{fill:none;stroke:#c5c9b8;stroke-width:.7}\n    .park-map .field-num{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:800;fill:#2f6b38;font-size:13px}\n    .park-map .field-sub{font-family:Inter,system-ui,sans-serif;font-weight:700;fill:#2f6b38;font-size:8px}\n    .park-map .label-sm{font-family:Inter,system-ui,sans-serif;font-weight:600;fill:#5a5248;font-size:8px}\n    .park-map .label-md{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:700;fill:#3d4a5c;font-size:11px}\n    .park-map [data-field].is-week{filter:drop-shadow(0 0 6px rgba(114,31,44,.55))}\n    .park-map [data-field].is-week .field-pitch{fill:#721f2c;stroke:#2d0c13;stroke-width:2.2}\n    .park-map [data-field].is-week .field-num,.park-map [data-field].is-week .field-sub{fill:#e8e2d4}\n    .park-map [data-field].is-practice .field-pitch{fill:#f3e6e4;stroke:#a34752;stroke-width:1.6}\n';
      html = html.replace('  </style>', style + '  </style>');
      var marker = 'Next practice is Wednesday, Sept 16, 5:30–6:00 PM on Field 8C.</p>';
      var block = marker + '\n        </div>\n      </div>\n      <div class="mt-5 pt-5 border-t border-pitch-100">\n        <div class="flex flex-wrap items-end justify-between gap-2 mb-3">\n          <div>\n            <h3 class="font-display text-lg font-bold text-pitch-900">Where to go</h3>\n            <p class="text-sm text-slate-600">Sports Park · 3589 Hwy K, O’Fallon. This week we are on <strong class="text-pitch-800">Field 8B</strong> — east half of Field 8 in the North Fields.</p>\n          </div>\n          <a href="https://maps.google.com/?q=3589+Hwy+K,+O\'Fallon,+MO+63368" target="_blank" rel="noopener" class="text-xs font-semibold text-pitch-700 underline">Open in Maps →</a>\n        </div>\n        <div class="rounded-2xl overflow-hidden border border-pitch-200 bg-[#e8eef2]"><img src="park-map.svg" alt="Sports Park map with Field 8B highlighted" class="park-map w-full h-auto"></div>\n        <div class="mt-3 grid sm:grid-cols-3 gap-2 text-xs">\n          <div class="rounded-xl bg-pitch-800 text-cream px-3 py-2"><p class="font-bold uppercase tracking-wide text-[10px] opacity-80">This week</p><p class="font-semibold">Game on Field 8B</p></div>\n          <div class="rounded-xl bg-pitch-50 border border-pitch-100 px-3 py-2 text-pitch-900"><p class="font-bold uppercase tracking-wide text-[10px] text-pitch-600">Park here</p><p class="font-semibold">North Fields lot — P just south of Field 8</p></div>\n          <div class="rounded-xl bg-pitch-50 border border-pitch-100 px-3 py-2 text-pitch-900"><p class="font-bold uppercase tracking-wide text-[10px] text-pitch-600">Practice</p><p class="font-semibold">Wednesdays on Field 8C, same complex</p></div>\n        </div>\n        <p class="text-xs text-slate-500 mt-3 leading-relaxed">Turn in off Highway K. Follow the main drive past the South Fields, cross the creek, and park at the North Fields lot. Field 8 is between Fields 7 and 9. <strong class="text-pitch-800">8B is the east half</strong> (closer to Field 9). Restrooms and concessions are by Field 10.</p>\n      </div>';
      if (html.indexOf(marker) !== -1) html = html.replace(marker, block);
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
