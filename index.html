<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Buffalo Maroonicorns · Fall 2026</title>
  <meta name="theme-color" content="#721f2c" />
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;color:#721f2c">Loading team page…</p>
  <script>
    (async function () {
      var urls = [
        'https://cdn.jsdelivr.net/gh/cjfogerty/fogertycommunity@68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html',
        'https://raw.githubusercontent.com/cjfogerty/fogertycommunity/68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html'
      ];
      var html = null;
      for (var i = 0; i < urls.length && !html; i++) {
        try {
          var res = await fetch(urls[i]);
          if (res.ok) html = await res.text();
        } catch (e) {}
      }
      if (!html) {
        document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load the team page. Try a refresh.</p>';
        return;
      }
      var style = '\n    .park-map{width:100%;height:auto;display:block}\n    .park-map-open{position:relative;display:block;width:100%;padding:0;border:0;background:#e8eef2;cursor:zoom-in}\n    .park-map-open:focus-visible{outline:3px solid #721f2c;outline-offset:2px}\n    .park-map-hint{position:absolute;right:10px;bottom:10px;z-index:2;border-radius:999px;background:rgba(114,31,44,.92);color:#f6efe6;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 10px;box-shadow:0 6px 16px rgba(45,12,19,.25)}\n    .park-map-dialog{padding:0;border:0;width:100vw;max-width:100vw;height:100vh;max-height:100vh;background:#14080b}\n    .park-map-dialog::backdrop{background:rgba(20,8,11,.72)}\n    .park-map-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#721f2c;color:#f6efe6}\n    .park-map-bar p{margin:0;font-size:13px;font-weight:700}\n    .park-map-bar .sub{display:block;font-size:10px;font-weight:600;opacity:.8}\n    .park-map-tools{display:flex;gap:6px}\n    .park-map-tools button{min-width:36px;height:36px;border:0;border-radius:10px;background:#f6efe6;color:#721f2c;font-size:18px;font-weight:800;cursor:pointer}\n    .park-map-tools [data-map-close]{background:#2d0c13;color:#f6efe6;font-size:13px;padding:0 10px}\n    .park-map-stage{height:calc(100vh - 56px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#0f1c24}\n    .park-map-stage img{display:block;width:160%;max-width:none;height:auto;margin:0 auto;transform-origin:center top}\n    .pic-steps{list-style:none;padding:0;margin:0;counter-reset:step}\n    .pic-steps li{position:relative;padding:10px 12px 10px 44px;border-bottom:1px solid #e4c6c4}\n    .pic-steps li:last-child{border-bottom:0}\n    .pic-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:999px;background:#721f2c;color:#f6efe6;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}\n';
      html = html.replace('  </style>', style + '  </style>');

      html = html.replace('Jerseys handed out', 'Picture Day');
      html = html.replace('Wear your jersey Saturday', 'This Saturday is Picture Day');
      html = html.replace(
        'Jerseys and socks were handed out at Wednesday practice. Wear the jersey for Saturday’s first game.',
        'STLDIGITAL will take team and individual photos Saturday, Sept 26. Wear your jersey. Meet at <strong class="text-pitch-800">8:15 AM</strong> behind the concession stand between Fields 9 and 10 — 45 minutes before the 9:00 AM kickoff.'
      );
      html = html.replace(
        'Team name is official: The Red Buffalo Maroonicorns.',
        'On the order form use team name <strong>The Red Buffalo Maroonicorns</strong> and age group <strong>U5</strong>.'
      );
      html = html.replace(
        '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-100 text-pitch-800">Game</span>',
        '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-amber-400 text-pitch-950">Picture Day</span>\n            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wide bg-pitch-100 text-pitch-800">Game</span>'
      );
      html = html.replace('Saturday, September 12', 'Saturday, September 26');
      html = html.replace('9:00 AM · Field 8B · vs Need Coach 1', 'Photos 8:15 AM · Game 9:00 AM · Field 8B vs Campos');
      var marker = 'Season opener. Wear your jersey. Snack: Alyssa Fogerty. Next practice is Wednesday, Sept 16, 5:30–6:00 PM on Field 8C.</p>';
      var block = 'Snack: Anna Lambert (Madelyn). Practice tonight (Wed, Sept 23) is 5:30–6:00 PM on Field 8C.</p>\n        </div>\n      </div>\n      <div class="mt-5 pt-5 border-t border-pitch-100">\n        <div class="rounded-2xl bg-amber-50 border border-amber-200 p-4 mb-5">\n          <p class="text-xs font-bold uppercase tracking-wide text-amber-800">Meet here · one time</p>\n          <p class="font-display text-2xl font-extrabold text-pitch-950 leading-tight mt-1">8:15 AM Saturday</p>\n          <p class="text-sm text-pitch-800 mt-1">Behind the concession stand, between Field 9 and Field 10. Do not go straight to Field 8B first — photos happen before kickoff.</p>\n        </div>\n        <div class="flex flex-wrap items-end justify-between gap-2 mb-3">\n          <div>\n            <h3 class="font-display text-lg font-bold text-pitch-900">Where to meet</h3>\n            <p class="text-sm text-slate-600">Sports Park · 3589 Hwy K, O’Fallon. Camera pin marks the photo spot. Field 8B is still the game field.</p>\n          </div>\n          <a href="https://maps.google.com/?q=3589+Hwy+K,+O\'Fallon,+MO+63368" target="_blank" rel="noopener" class="text-xs font-semibold text-pitch-700 underline">Open in Maps →</a>\n        </div>\n        <button type="button" class="park-map-open rounded-2xl overflow-hidden border border-pitch-200" data-open-map aria-haspopup="dialog" aria-controls="park-map-dialog">\n          <img src="park-map.svg?v=4" alt="Sports Park map with Picture Day meet spot between Fields 9 and 10. Tap to expand." class="park-map w-full h-auto">\n          <span class="park-map-hint">Tap to expand</span>\n        </button>\n        <div class="mt-3 grid sm:grid-cols-3 gap-2 text-xs">\n          <div class="rounded-xl bg-amber-500 text-pitch-950 px-3 py-2"><p class="font-bold uppercase tracking-wide text-[10px] opacity-80">Meet</p><p class="font-semibold">8:15 AM behind concession · Fields 9 & 10</p></div>\n          <div class="rounded-xl bg-pitch-800 text-cream px-3 py-2"><p class="font-bold uppercase tracking-wide text-[10px] opacity-80">Then play</p><p class="font-semibold">9:00 AM game on Field 8B</p></div>\n          <div class="rounded-xl bg-pitch-50 border border-pitch-100 px-3 py-2 text-pitch-900"><p class="font-bold uppercase tracking-wide text-[10px] text-pitch-600">Park here</p><p class="font-semibold">North Fields lot — P just south of Field 8</p></div>\n        </div>\n        <p class="text-xs text-slate-500 mt-3 leading-relaxed">Turn in off Highway K. Follow the main drive past the South Fields, cross the creek, and park at the North Fields lot. Walk to the concession stand between Fields 9 and 10. After photos, Field 8B is the east half of Field 8 (closer to Field 9).</p>\n      </div>';
      if (html.indexOf(marker) !== -1) html = html.replace(marker, block);

      var processCard = '\n    <section class="card rounded-3xl border border-amber-200/80 p-6 sm:p-7">\n      <h2 class="font-display text-xl font-bold text-pitch-900 mb-1">Team Photo Day process</h2>\n      <p class="text-sm text-slate-600 mb-4">STLDIGITAL is photographing our teams Saturday 9/26. Arrive 45 minutes before game time. All photos are taken behind the concession stand (between Field 9 and Field 10).</p>\n      <ol class="pic-steps text-sm text-slate-700 bg-pitch-50 rounded-2xl border border-pitch-100 overflow-hidden">\n        <li>Check in at the STLDIGITAL table when you arrive.</li>\n        <li>Fill out the order form ahead of time, or grab one at the table if you want pictures.</li>\n        <li>Pay at the STLDIGITAL table. Cards, Venmo, or cash. Venmo is payment only — parents must show proof of Venmo payment at the table and still fill out an order form.</li>\n        <li>Put <strong>The Red Buffalo Maroonicorns</strong> and age group <strong>U5</strong> on your order form.</li>\n        <li>Go get your individual picture taken. Do not wait for the whole team — they want individual photos right away.</li>\n        <li>After the individual photo, gather with your team.</li>\n        <li>Once the whole team is present, they take the team photo.</li>\n        <li>Head to Field 8B for the 9:00 AM game.</li>\n      </ol>\n      <div class="mt-4 grid sm:grid-cols-2 gap-3">\n        <a href="https://drive.google.com/file/d/1V0PlHwwObGR5qA7vs1iw8YxXoEmUx1Br/view?usp=sharing" target="_blank" rel="noopener" class="block rounded-2xl bg-pitch-800 text-cream p-4 hover:bg-pitch-700">\n          <p class="text-xs font-bold uppercase tracking-wide opacity-80">Order form · single pose</p>\n          <p class="font-semibold mt-1">Open the PDF order form →</p>\n          <p class="text-xs text-cream/80 mt-1">Printed forms will also be onsite.</p>\n        </a>\n        <div class="rounded-2xl bg-amber-50 border border-amber-200 p-4">\n          <p class="text-xs font-bold uppercase tracking-wide text-amber-800">Want extra poses?</p>\n          <p class="font-semibold text-pitch-950 mt-1">“Media Day” (3 poses)</p>\n          <p class="text-sm text-slate-600 mt-1">Only available on picture day. Ask for a yellow form onsite. Otherwise it is 1 pose per athlete.</p>\n        </div>\n      </div>\n    </section>';
      var calMarker = '<section class="card rounded-3xl shadow-xl border border-white/60 p-6 sm:p-7">\n      <div class="flex flex-col sm:flex-row sm:items-center gap-5">';
      if (html.indexOf(calMarker) !== -1) html = html.replace(calMarker, processCard + '\n    ' + calMarker);

      var extras = '\n<dialog id="park-map-dialog" class="park-map-dialog">\n  <div class="park-map-bar">\n    <p>Picture Day meet<span class="sub">Behind concession · Fields 9 & 10 · pinch or use + / −</span></p>\n    <div class="park-map-tools">\n      <button type="button" data-map-zoom="-1" aria-label="Zoom out">−</button>\n      <button type="button" data-map-zoom="1" aria-label="Zoom in">+</button>\n      <button type="button" data-map-close>Close</button>\n    </div>\n  </div>\n  <div class="park-map-stage" id="park-map-stage">\n    <img id="park-map-large" src="park-map.svg?v=4" alt="Expanded Sports Park map with Picture Day meet spot highlighted">\n  </div>\n</dialog>\n<script>\n(function () {\n  var dialog = document.getElementById("park-map-dialog");\n  var stage = document.getElementById("park-map-stage");\n  var img = document.getElementById("park-map-large");\n  var zoom = 1.6;\n  function applyZoom() {\n    img.style.width = (zoom * 100) + "%";\n  }\n  function openMap() {\n    applyZoom();\n    if (dialog.showModal) dialog.showModal();\n    else dialog.setAttribute("open", "");\n    requestAnimationFrame(function () {\n      var x = Math.max(0, (img.clientWidth * 0.50) - (stage.clientWidth / 2));\n      var y = Math.max(0, (img.clientHeight * 0.16) - 40);\n      stage.scrollTo(x, y);\n    });\n  }\n  function closeMap() {\n    if (dialog.close) dialog.close();\n    else dialog.removeAttribute("open");\n  }\n  document.querySelectorAll("[data-open-map]").forEach(function (el) {\n    el.addEventListener("click", openMap);\n  });\n  document.querySelectorAll("[data-map-close]").forEach(function (el) {\n    el.addEventListener("click", closeMap);\n  });\n  document.querySelectorAll("[data-map-zoom]").forEach(function (el) {\n    el.addEventListener("click", function () {\n      zoom = Math.min(3.2, Math.max(1, zoom + Number(el.getAttribute("data-map-zoom")) * 0.35));\n      applyZoom();\n    });\n  });\n  dialog.addEventListener("click", function (e) {\n    if (e.target === dialog) closeMap();\n  });\n  document.addEventListener("keydown", function (e) {\n    if (e.key === "Escape") closeMap();\n  });\n})();\n<\\/script>\n';
      html = html.replace('</body>', extras + '</body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
