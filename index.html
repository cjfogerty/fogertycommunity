<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Buffalo Maroonicorns · Fall 2026</title>
  <meta name="theme-color" content="#721f2c" />
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;color:#721f2c">Loading team page…</p>
  <script>
    (async function () {
      var urls = [
        'https://cdn.jsdelivr.net/gh/cjfogerty/fogertycommunity@68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html',
        'https://raw.githubusercontent.com/cjfogerty/fogertycommunity/68e41da7559334fc3a7d49249ce083e8cbbb3763/index.html'
      ];
      var html = null;
      for (var i = 0; i < urls.length && !html; i++) {
        try {
          var res = await fetch(urls[i]);
          if (res.ok) html = await res.text();
        } catch (e) {}
      }
      if (!html) {
        document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load the team page. Try a refresh.</p>';
        return;
      }
      var style = '\n    .park-map{width:100%;height:auto;display:block}\n    .park-map-open{position:relative;display:block;width:100%;padding:0;border:0;background:#e8eef2;cursor:zoom-in}\n    .park-map-open:focus-visible{outline:3px solid #721f2c;outline-offset:2px}\n    .park-map-hint{position:absolute;right:10px;bottom:10px;z-index:2;border-radius:999px;background:rgba(114,31,44,.92);color:#f6efe6;font-size:11px;font-weight:700;letter-spacing:.02em;padding:6px 10px;box-shadow:0 6px 16px rgba(45,12,19,.25)}\n    .park-map-dialog{padding:0;border:0;width:100vw;max-width:100vw;height:100vh;max-height:100vh;background:#14080b}\n    .park-map-dialog::backdrop{background:rgba(20,8,11,.72)}\n    .park-map-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#721f2c;color:#f6efe6}\n    .park-map-bar p{margin:0;font-size:13px;font-weight:700}\n    .park-map-bar .sub{display:block;font-size:10px;font-weight:600;opacity:.8}\n    .park-map-tools{display:flex;gap:6px}\n    .park-map-tools button{min-width:36px;height:36px;border:0;border-radius:10px;background:#f6efe6;color:#721f2c;font-size:18px;font-weight:800;cursor:pointer}\n    .park-map-tools [data-map-close]{background:#2d0c13;color:#f6efe6;font-size:13px;padding:0 10px}\n    .park-map-stage{height:calc(100vh - 56px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#0f1c24}\n    .park-map-stage img{display:block;width:160%;max-width:none;height:auto;margin:0 auto;transform-origin:center top}\n';
      html = html.replace('  </style>', style + '  </style>');
      var marker = 'Next practice is Wednesday, Sept 16, 5:30–6:00 PM on Field 8C.</p>';
      var block = marker + '\n        </div>\n      </div>\n      <div class="mt-5 pt-5 border-t border-pitch-100">\n        <div class="flex flex-wrap items-end justify-between gap-2 mb-3">\n          <div>\n            <h3 class="font-display text-lg font-bold text-pitch-900">Where to go</h3>\n            <p class="text-sm text-slate-600">Sports Park · 3589 Hwy K, O’Fallon. This week we are on <strong class="text-pitch-800">Field 8B</strong> — east half of Field 8 in the North Fields.</p>\n          </div>\n          <a href="https://maps.google.com/?q=3589+Hwy+K,+O\'Fallon,+MO+63368" target="_blank" rel="noopener" class="text-xs font-semibold text-pitch-700 underline">Open in Maps →</a>\n        </div>\n        <button type="button" class="park-map-open rounded-2xl overflow-hidden border border-pitch-200" data-open-map aria-haspopup="dialog" aria-controls="park-map-dialog">\n          <img src="park-map.svg?v=3" alt="Sports Park map with Field 8B highlighted. Tap to expand." class="park-map w-full h-auto">\n          <span class="park-map-hint">Tap to expand</span>\n        </button>\n        <div class="mt-3 grid sm:grid-cols-3 gap-2 text-xs">\n          <div class="rounded-xl bg-pitch-800 text-cream px-3 py-2"><p class="font-bold uppercase tracking-wide text-[10px] opacity-80">This week</p><p class="font-semibold">Game on Field 8B</p></div>\n          <div class="rounded-xl bg-pitch-50 border border-pitch-100 px-3 py-2 text-pitch-900"><p class="font-bold uppercase tracking-wide text-[10px] text-pitch-600">Park here</p><p class="font-semibold">North Fields lot — P just south of Field 8</p></div>\n          <div class="rounded-xl bg-pitch-50 border border-pitch-100 px-3 py-2 text-pitch-900"><p class="font-bold uppercase tracking-wide text-[10px] text-pitch-600">Practice</p><p class="font-semibold">Wednesdays on Field 8C, same complex</p></div>\n        </div>\n        <p class="text-xs text-slate-500 mt-3 leading-relaxed">Turn in off Highway K. Follow the main drive past the South Fields, cross the creek, and park at the North Fields lot. Field 8 is between Fields 7 and 9. <strong class="text-pitch-800">8B is the east half</strong> (closer to Field 9). Restrooms and concessions are by Field 10.</p>\n      </div>';
      if (html.indexOf(marker) !== -1) html = html.replace(marker, block);
      var extras = '\n<dialog id="park-map-dialog" class="park-map-dialog">\n  <div class="park-map-bar">\n    <p>Field 8B<span class="sub">Pinch or use + / − to zoom · drag to pan</span></p>\n    <div class="park-map-tools">\n      <button type="button" data-map-zoom="-1" aria-label="Zoom out">−</button>\n      <button type="button" data-map-zoom="1" aria-label="Zoom in">+</button>\n      <button type="button" data-map-close>Close</button>\n    </div>\n  </div>\n  <div class="park-map-stage" id="park-map-stage">\n    <img id="park-map-large" src="park-map.svg?v=3" alt="Expanded Sports Park map with Field 8B highlighted">\n  </div>\n</dialog>\n<script>\n(function () {\n  var dialog = document.getElementById("park-map-dialog");\n  var stage = document.getElementById("park-map-stage");\n  var img = document.getElementById("park-map-large");\n  var zoom = 1.6;\n  function applyZoom() {\n    img.style.width = (zoom * 100) + "%";\n  }\n  function openMap() {\n    applyZoom();\n    if (dialog.showModal) dialog.showModal();\n    else dialog.setAttribute("open", "");\n    requestAnimationFrame(function () {\n      var x = Math.max(0, (img.clientWidth * 0.34) - (stage.clientWidth / 2));\n      var y = Math.max(0, (img.clientHeight * 0.18) - 40);\n      stage.scrollTo(x, y);\n    });\n  }\n  function closeMap() {\n    if (dialog.close) dialog.close();\n    else dialog.removeAttribute("open");\n  }\n  document.querySelectorAll("[data-open-map]").forEach(function (el) {\n    el.addEventListener("click", openMap);\n  });\n  document.querySelectorAll("[data-map-close]").forEach(function (el) {\n    el.addEventListener("click", closeMap);\n  });\n  document.querySelectorAll("[data-map-zoom]").forEach(function (el) {\n    el.addEventListener("click", function () {\n      zoom = Math.min(3.2, Math.max(1, zoom + Number(el.getAttribute("data-map-zoom")) * 0.35));\n      applyZoom();\n    });\n  });\n  dialog.addEventListener("click", function (e) {\n    if (e.target === dialog) closeMap();\n  });\n  document.addEventListener("keydown", function (e) {\n    if (e.key === "Escape") closeMap();\n  });\n})();\n<\/script>\n';
      html = html.replace('</body>', extras + '</body>');
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
