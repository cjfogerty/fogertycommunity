<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fogerty U5 Soccer Team</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="cache-control" content="no-cache" />
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(#14532d, #052e16);
      display: flex; align-items: center; justify-content: center;
    }
    form {
      background: #fff; width: 340px; padding: 40px 36px; text-align: center;
      border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 8px; color: #14532d; font-size: 22px; }
    p { color: #4b5563; font-size: 14px; margin: 0 0 18px; }
    input {
      width: 100%; box-sizing: border-box; padding: 14px; margin: 0 0 12px;
      border: 0; background: #f3f4f6; font-size: 14px; border-radius: 8px;
    }
    button {
      width: 100%; border: 0; padding: 14px; background: #16a34a; color: #fff;
      font-weight: 700; letter-spacing: .04em; border-radius: 8px; cursor: pointer;
    }
    .err { color: #b91c1c; font-size: 13px; min-height: 18px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <form id="gate" autocomplete="off">
    <h1>Fogerty U5 Soccer Team</h1>
    <p>Parents: use the team passphrase from Coach Casey.</p>
    <div class="err" id="err"></div>
    <input id="pw" type="password" placeholder="Team passphrase" autofocus />
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:#374151;margin:0 0 14px">
      <input type="checkbox" id="remember" /> Remember me
    </label>
    <button type="submit">Open team page</button>
  </form>
  <script>
    const KEY = 'fogerty-u5-gate';
    const EXPECTED = 'b71c6bcb0ef1c23e913ff37e0bc744b380f1f0082a47852ddf29e9570ebc07d0';
    function openTeam() { window.location.replace('schedule.html'); }
    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
    if (localStorage.getItem(KEY) === '1') openTeam();
    document.getElementById('gate').addEventListener('submit', async function (e) {
      e.preventDefault();
      const value = document.getElementById('pw').value.trim().toLowerCase();
      const hashed = await sha256(value);
      if (hashed === EXPECTED) {
        if (document.getElementById('remember').checked) localStorage.setItem(KEY, '1');
        openTeam();
      } else {
        document.getElementById('err').textContent = 'Bad password!';
      }
    });
  </script>
</body>
</html>
