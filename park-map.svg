<svg class="park-map" viewBox="0 0 920 318" role="img" aria-labelledby="park-map-title park-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="park-map-title">O’Fallon Sports Park field map</title>
<desc id="park-map-desc">North Fields 6–12. The concession stand sits between Fields 9 and 10. Picture Day meet is behind that building (north side) at 8:15 AM. Game is on Field 8B at 9:00 AM.</desc>
<style>
.field-pitch{fill:#f7f4ee;stroke:#8a8f7a;stroke-width:1.2}
.field-lines{fill:none;stroke:#c5c9b8;stroke-width:.7}
.field-num{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:800;fill:#2f6b38;font-size:13px}
.field-sub{font-family:Inter,system-ui,sans-serif;font-weight:700;fill:#2f6b38;font-size:8px}
.label-sm{font-family:Inter,system-ui,sans-serif;font-weight:600;fill:#5a5248;font-size:8px}
.label-md{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:700;fill:#3d4a5c;font-size:11px}
.week .field-pitch{fill:#721f2c;stroke:#2d0c13;stroke-width:2.2}
.week .field-sub,.week .field-num{fill:#e8e2d4}
.practice .field-pitch{fill:#f3e6e4;stroke:#a34752;stroke-width:1.6}
.week{
  transform-box:fill-box;
  transform-origin:center;
  animation:weekPulse 1.9s ease-in-out infinite;
  filter:url(#weekGlow);
}
#week-pin{
  transform-box:fill-box;
  transform-origin:center bottom;
  animation:pinBob 1.9s ease-in-out infinite;
}
#photo-pin{
  transform-box:fill-box;
  transform-origin:center bottom;
  animation:pinBob 1.6s ease-in-out infinite;
  filter:url(#photoGlow);
}
@keyframes weekPulse{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-5px) scale(1.12)}
}
@keyframes pinBob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.16)}
}
@media (prefers-reduced-motion:reduce){
  .week,#week-pin,#photo-pin{animation:none}
}
</style>
<defs>
  <filter id="weekGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="2" stdDeviation="4.5" flood-color="#721f2c" flood-opacity=".75"/>
  </filter>
  <filter id="photoGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#d97706" flood-opacity=".85"/>
  </filter>
</defs>
<rect width="920" height="318" fill="#e8eef2"/>
<rect x="0" y="0" width="920" height="36" fill="#1d4f8a"/>
<text x="24" y="24" fill="#fff" font-family="Outfit, Inter, sans-serif" font-size="16" font-weight="800">Sports Park</text>
<text x="896" y="23" text-anchor="end" fill="#d6e4f2" font-family="Inter, sans-serif" font-size="9">3589 Hwy K, O’Fallon, MO 63368</text>
<path d="M0 268 C 180 252, 340 278, 520 262 C 680 248, 800 272, 920 258 L 920 292 C 800 306, 680 282, 520 296 C 340 312, 180 286, 0 302 Z" fill="#b7d4e6"/>
<path d="M40 250 H 560 Q 590 250 610 230 V 150 H 860" fill="none" stroke="#c5ccd1" stroke-width="22"/>
<path d="M250 250 V 318 H 40" fill="none" stroke="#c5ccd1" stroke-width="18"/>
<path d="M610 230 L 690 318 H 880" fill="none" stroke="#c5ccd1" stroke-width="16"/>
<rect x="848" y="36" width="72" height="282" fill="#d7dde1"/>
<text x="884" y="186" text-anchor="middle" fill="#5b6570" font-family="Outfit, sans-serif" font-size="10" font-weight="700" transform="rotate(90 884 186)">Highway K</text>
<text x="24" y="58" class="label-md">North Fields</text>
<text x="24" y="308" class="label-md">South Fields ↓</text>
<g fill="#1d4f8a">
<circle cx="248" cy="236" r="11"/><text x="248" y="240" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Outfit, sans-serif">P</text>
<circle cx="618" cy="198" r="11"/><text x="618" y="202" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Outfit, sans-serif">P</text>
<circle cx="792" cy="188" r="11"/><text x="792" y="192" text-anchor="middle" fill="#fff" font-size="10" font-weight="800" font-family="Outfit, sans-serif">P</text>
</g>
<g data-field="6A"><rect class="field-pitch" x="28" y="168" width="72" height="58" rx="3"/><line class="field-lines" x1="64" y1="168" x2="64" y2="226"/><text class="field-sub" x="46" y="202" text-anchor="middle">A</text></g>
<g data-field="6B"><rect class="field-pitch" x="100" y="168" width="72" height="58" rx="3"/><line class="field-lines" x1="136" y1="168" x2="136" y2="226"/><text class="field-sub" x="136" y="202" text-anchor="middle">B</text></g>
<text class="field-num" x="100" y="204" text-anchor="middle">6</text>
<g data-field="7A"><rect class="field-pitch" x="28" y="78" width="72" height="72" rx="3"/><line class="field-lines" x1="64" y1="78" x2="64" y2="150"/><text class="field-sub" x="46" y="118" text-anchor="middle">A</text></g>
<g data-field="7B"><rect class="field-pitch" x="100" y="78" width="72" height="72" rx="3"/><line class="field-lines" x1="136" y1="78" x2="136" y2="150"/><text class="field-sub" x="136" y="118" text-anchor="middle">B</text></g>
<text class="field-num" x="100" y="120" text-anchor="middle">7</text>
<g data-field="8A"><rect class="field-pitch" x="196" y="78" width="78" height="86" rx="3"/><line class="field-lines" x1="235" y1="78" x2="235" y2="164"/><text class="field-sub" x="216" y="126" text-anchor="middle">A</text></g>
<g class="week" data-field="8B"><rect class="field-pitch" x="274" y="78" width="78" height="86" rx="3"/><line class="field-lines" x1="313" y1="78" x2="313" y2="164"/><text class="field-sub" x="313" y="126" text-anchor="middle">B</text></g>
<text class="field-num" x="274" y="128" text-anchor="middle">8</text>
<g class="practice" data-field="8C"><rect class="field-pitch" x="196" y="166" width="156" height="18" rx="2"/><text class="field-sub" x="274" y="179" text-anchor="middle">8C practice strip</text></g>
<g data-field="9"><rect class="field-pitch" x="378" y="78" width="92" height="86" rx="3"/><line class="field-lines" x1="424" y1="78" x2="424" y2="164"/><ellipse class="field-lines" cx="424" cy="121" rx="10" ry="14"/><text class="field-num" x="424" y="126" text-anchor="middle">9</text></g>
<g data-field="10"><rect class="field-pitch" x="528" y="70" width="78" height="70" rx="3"/><line class="field-lines" x1="567" y1="70" x2="567" y2="140"/><text class="field-num" x="567" y="110" text-anchor="middle">10</text></g>
<g id="north-concession">
  <rect x="474" y="108" width="50" height="34" rx="3" fill="#edf0f3" stroke="#8a6a3a" stroke-width="1.3"/>
  <rect x="476" y="110" width="46" height="14" rx="2" fill="#d9772a"/>
  <text x="499" y="120" text-anchor="middle" fill="#fff" font-size="6.2" font-weight="700" font-family="Inter, sans-serif">Concession</text>
  <text x="499" y="134" text-anchor="middle" fill="#5a5248" font-size="6.2" font-weight="700" font-family="Inter, sans-serif">Restrooms</text>
</g>
<g data-field="11"><rect class="field-pitch" x="636" y="58" width="70" height="64" rx="3"/><line class="field-lines" x1="671" y1="58" x2="671" y2="122"/><text class="field-num" x="671" y="96" text-anchor="middle">11</text></g>
<g data-field="12"><rect class="field-pitch" x="722" y="48" width="70" height="64" rx="3"/><line class="field-lines" x1="757" y1="48" x2="757" y2="112"/><text class="field-num" x="757" y="86" text-anchor="middle">12</text></g>
<text x="40" y="64" class="label-sm">← To the Renaud Center</text>
<text x="780" y="148" class="label-sm">Maintenance</text>
<g id="week-pin"><path d="M313 64 l6 12 h-12 z" fill="#721f2c"/><circle cx="313" cy="58" r="11" fill="#721f2c" stroke="#e8e2d4" stroke-width="2"/><text x="313" y="62" text-anchor="middle" fill="#e8e2d4" font-size="8" font-weight="800" font-family="Outfit, sans-serif">8B</text></g>
<g id="photo-pin">
  <path d="M499 92 l7 12 h-14 z" fill="#d97706"/>
  <circle cx="499" cy="78" r="16" fill="#f59e0b" stroke="#fff7ed" stroke-width="2.4"/>
  <rect x="491" y="74" width="16" height="11" rx="2" fill="#fff7ed"/>
  <circle cx="499" cy="79.5" r="3.2" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <rect x="502.5" y="72.2" width="3.2" height="2.2" rx="0.6" fill="#fff7ed"/>
  <rect x="430" y="46" width="28" height="13" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.4"/>
  <text x="444" y="55.5" text-anchor="middle" fill="#1a0508" font-size="6" font-weight="800" font-family="Outfit, sans-serif">PHOTOS</text>
  <text x="444" y="68" text-anchor="middle" fill="#92400e" font-size="7.5" font-weight="800" font-family="Outfit, sans-serif">8:15 AM MEET</text>
</g>
</svg>
