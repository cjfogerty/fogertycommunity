<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Tracker — Knox / Fulton / Quad Cities Region</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<script src="vendor/leaflet/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1419; --panel:#1a222c; --panel2:#222c38; --text:#e7ecf1; --muted:#8b97a5;
    --accent:#3d9cf0; --accent2:#2ecc71; --warn:#f0a030; --danger:#e74c3c; --line:#2a3542;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
  header h1{font-size:1.15rem;letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  .meta{font-size:.78rem;color:var(--muted)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .controls label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .controls select,.controls input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.85rem}
  .controls input[type=number]{width:84px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:.85rem;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 20px}
  .chip{font-size:.72rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .layout{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:stretch;overflow:hidden}
  #map{height:100%;min-height:0;width:100%;background:#d5d0c4}
  .leaflet-container{background:#d5d0c4}
  aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0;height:100%}
  aside .tabs{display:flex;border-bottom:1px solid var(--line)}
  aside .tab{flex:1;padding:10px;text-align:center;font-size:.82rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  aside .tab.on{color:var(--text);border-bottom-color:var(--accent)}
  .list{overflow-y:auto;flex:1}
  .card{border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer;transition:background .15s}
  .card:hover{background:var(--panel2)}
  .card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .card .price{font-weight:700;color:var(--accent2)}
  .card .acres{font-size:.8rem;color:var(--muted)}
  .card .title{font-size:.88rem;margin-top:2px}
  .card .sub{font-size:.72rem;color:var(--muted);margin-top:2px}
  .card .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:.65rem;padding:2px 7px;border-radius:4px;background:var(--panel2);color:var(--muted)}
  .tag.home{background:#1e3a2f;color:var(--accent2)}
  .tag.pending{background:#3a2e1e;color:var(--warn)}
  .tag.contract{background:#3a1e1e;color:var(--danger)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto}
  .modal .hero{width:100%;height:280px;object-fit:cover;border-radius:12px 12px 0 0;background:#111}
  .modal .body{padding:18px 20px}
  .modal h2{font-size:1.2rem;margin-bottom:4px}
  .modal .row{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;font-size:.85rem}
  .modal .row div b{color:var(--muted);font-weight:500}
  .modal p{font-size:.88rem;line-height:1.55;color:#c9d2db;margin:10px 0}
  .modal .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .modal .photos img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#111}
  .modal a.btn{display:inline-block;margin-top:8px;text-decoration:none}
  .modal .close{position:absolute;right:16px;top:12px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer}
  .modal-wrap{position:relative}
  .stats{display:flex;gap:16px;padding:8px 20px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line)}
  .stats b{color:var(--text)}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:8px;border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel)}
  .popup h3{font-size:.9rem;margin-bottom:4px}
  .popup .p{font-size:.75rem;color:var(--muted);line-height:1.4}
  .popup a{color:var(--accent);font-size:.75rem}
  @media(max-width:900px){
    body{display:flex;flex-direction:column;height:auto;min-height:100dvh;overflow:auto}
    .layout{display:contents}
    #map{order:-1;height:58dvh;min-height:300px;flex:none}
    header{order:0}
    .controls,.chips,.stats{order:1}
    aside{order:2;border-left:none;border-top:1px solid var(--line);height:auto;max-height:none}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🌲 <span>Land Tracker</span> — Knox / Fulton / Quad Cities Region</h1>
    <div class="meta" id="metaLine">Loading data…</div>
  </div>
  <div class="meta">Default filter: <b>2–10 acres</b> · All counties · All sizes available via filters</div>
</header>

<div class="controls">
  <label>County
    <select id="fCounty"><option value="">All</option></select>
  </label>
  <label>Min acres<input type="number" id="fMinAcres" value="2" step="0.1"></label>
  <label>Max acres<input type="number" id="fMaxAcres" value="10" step="0.1"></label>
  <label>Min price<input type="number" id="fMinPrice" placeholder="any" step="1000"></label>
  <label>Max price<input type="number" id="fMaxPrice" placeholder="any" step="1000"></label>
  <label>Status
    <select id="fStatus">
      <option value="">All</option>
      <option value="Active">Active</option>
      <option value="Pending sale">Pending</option>
      <option value="Under contract">Under contract</option>
    </select>
  </label>
  <button class="btn" id="btnApply">Apply</button>
  <button class="btn ghost" id="btnReset">Reset to 2–10 ac</button>
</div>
<div class="chips">
  <div class="chip" data-chip="home">Has home</div>
  <div class="chip" data-chip="timber">Timber</div>
  <div class="chip" data-chip="hills">Hills</div>
  <div class="chip" data-chip="views">Views</div>
  <div class="chip" data-chip="creek">Creek</div>
  <div class="chip" data-chip="pond">Pond</div>
  <div class="chip" data-chip="food_plots">Food plots</div>
</div>
<div class="stats" id="stats"></div>

<div class="layout">
  <div id="map"></div>
  <aside>
    <div class="tabs">
      <div class="tab on" data-tab="cards">Cards</div>
      <div class="tab" data-tab="table">Table</div>
    </div>
    <div class="list" id="cardList"></div>
    <div class="list" id="tableList" style="display:none;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:.78rem">
        <thead><tr style="color:var(--muted);text-align:left">
          <th style="padding:8px">Price</th><th>Acres</th><th>County</th><th>City</th><th>Home</th><th>Status</th><th>Timber</th><th>Hills</th><th>Views</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </aside>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal modal-wrap">
    <button class="close" id="modalClose">×</button>
    <img class="hero" id="modalHero" alt="">
    <div class="body">
      <h2 id="modalTitle"></h2>
      <div class="row" id="modalRow"></div>
      <p id="modalDesc"></p>
      <div class="photos" id="modalPhotos"></div>
      <a class="btn" id="modalLink" target="_blank" rel="noreferrer">Open listing ↗</a>
    </div>
  </div>
</div>

<script>
let DATA = null;
let map, markersLayer, polyLayer;
const state = {county:"", minAcres:2, maxAcres:10, minPrice:null, maxPrice:null, status:"", chips:new Set()};

function fmtPrice(p){ if(p==null) return "—"; if(p>=1e6) return "$"+(p/1e6).toFixed(2)+"M"; return "$"+p.toLocaleString(); }
function esc(s){ return String(s??"").replace(/&/g,"\u0026amp;").replace(/</g,"\u0026lt;").replace(/>/g,"\u0026gt;").replace(/"/g,"\u0026quot;"); }
function homeLine(l){
  if(!l.home) return "Land only";
  const bits=[];
  if(l.beds!=null) bits.push(l.beds+" bd");
  if(l.baths!=null) bits.push(l.baths+" ba");
  if(l.sqft!=null) bits.push(Number(l.sqft).toLocaleString()+" sqft");
  return bits.join(" / ") || "Home";
}

async function load(){
  const res = await fetch("listings.json");
  DATA = await res.json();
  document.getElementById("metaLine").textContent =
    `Last updated: ${DATA.meta.generated.replace("T"," ").slice(0,16)} UTC · ${DATA.meta.count} listings · source: ${DATA.meta.source}`;
  const counties = [...new Set(DATA.listings.map(l=>l.county))].sort();
  const stateBy = {};
  DATA.listings.forEach(l=>{ if(!stateBy[l.county]) stateBy[l.county]=l.state; });
  const sel = document.getElementById("fCounty");
  counties.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c+" County ("+(stateBy[c]||"")+")"; sel.appendChild(o); });
  render();
  requestAnimationFrame(()=>requestAnimationFrame(fitMap));
}

function settleMap(){
  if(!map) return;
  map.invalidateSize({animate:false});
}
function fitMap(){
  if(!map) return;
  settleMap();
  const pts = filtered().filter(l=>l.lat!=null && l.lng!=null).map(l=>[l.lat,l.lng]);
  if(pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:11});
}
function initMap(){
  const el = document.getElementById("map");
  if(typeof L==="undefined"){
    el.innerHTML = '<p style="padding:18px;color:#8b97a5">Map library failed to load.</p>';
    return;
  }
  map = L.map(el,{zoomControl:true}).setView([40.85,-90.25], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19,
    subdomains:"abc"
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  polyLayer = L.layerGroup().addTo(map);
  requestAnimationFrame(()=>requestAnimationFrame(settleMap));
}

function filtered(){
  return DATA.listings.filter(l=>{
    if(state.county && l.county!==state.county) return false;
    if(l.acres==null){ if(state.minAcres||state.maxAcres) return false; }
    else { if(state.minAcres!=null && l.acres<state.minAcres) return false; if(state.maxAcres!=null && l.acres>state.maxAcres) return false; }
    if(state.minPrice!=null && l.price<state.minPrice) return false;
    if(state.maxPrice!=null && l.price>state.maxPrice) return false;
    if(state.status && l.status!==state.status) return false;
    for(const c of state.chips){ if(!l[c]) return false; }
    return true;
  });
}

function render(){
  const list = filtered();
  const homes = list.filter(l=>l.home).length;
  const acres = list.filter(l=>l.acres!=null).reduce((a,l)=>a+l.acres,0);
  document.getElementById("stats").innerHTML =
    `<span><b>${list.length}</b> listings</span><span><b>${homes}</b> with homes</span><span><b>${acres.toFixed(1)}</b> total acres</span><span>avg <b>${list.length? (list.filter(l=>l.price).reduce((a,l)=>a+l.price,0)/Math.max(list.filter(l=>l.price).length,1)/1000).toFixed(0):0}k</b></span>`;
  const cl = document.getElementById("cardList");
  cl.innerHTML = list.map(l=>`
    <div class="card" onclick="openModal('${l.id}')">
      <div class="top"><span class="price">${fmtPrice(l.price)}</span><span class="acres">${l.acres??"?"} ac</span></div>
      <div class="title">${esc(l.city)}, ${esc(l.county)} County${l.state==="IA"?" (IA)":""}</div>
      <div class="sub">${homeLine(l)} · ${esc(l.status)}</div>
      <div class="tags">
        ${l.home?'<span class="tag home">HOME</span>':''}
        ${l.timber?'<span class="tag">timber</span>':''}
        ${l.hills?'<span class="tag">hills</span>':''}
        ${l.views?'<span class="tag">views</span>':''}
        ${l.creek?'<span class="tag">creek</span>':''}
        ${l.pond?'<span class="tag">pond</span>':''}
        ${l.food_plots?'<span class="tag">food plots</span>':''}
        ${l.status!=="Active"?'<span class="tag '+(l.status==="Pending sale"?"pending":"contract")+'">'+esc(l.status)+'</span>':''}
      </div>
    </div>`).join("") || `<div style="padding:30px;color:var(--muted);text-align:center">No listings match these filters.</div>`;
  const tb = document.getElementById("tableBody");
  tb.innerHTML = list.map(l=>`<tr style="border-bottom:1px solid var(--line);cursor:pointer" onclick="openModal('${l.id}')">
    <td style="padding:7px 8px;color:var(--accent2);font-weight:600">${fmtPrice(l.price)}</td>
    <td style="padding:7px 8px">${l.acres??"—"}</td>
    <td style="padding:7px 8px">${esc(l.county)}</td>
    <td style="padding:7px 8px">${esc(l.city)}</td>
    <td style="padding:7px 8px">${l.home?"✓":""}</td>
    <td style="padding:7px 8px;color:var(--muted)">${esc(l.status)}</td>
    <td style="padding:7px 8px">${l.timber?"✓":""}</td>
    <td style="padding:7px 8px">${l.hills?"✓":""}</td>
    <td style="padding:7px 8px">${l.views?"✓":""}</td>
  </tr>`).join("");
  if(!map || !markersLayer) return;
  markersLayer.clearLayers(); polyLayer.clearLayers();
  const bounds = [];
  list.forEach(l=>{
    if(l.lat==null || l.lng==null) return;
    const m = L.circleMarker([l.lat,l.lng], {radius: l.home?8:6, color: l.home?"#2ecc71":"#3d9cf0", fillColor: l.home?"#2ecc71":"#3d9cf0", fillOpacity:.9, weight:2});
    m.on("click", ()=>openModal(l.id));
    m.bindPopup(`<div class="popup"><h3>${esc(l.city)} · ${fmtPrice(l.price)}</h3><div class="p">${l.acres??"?"} acres · ${l.home?"home":"land only"}<br>${esc(l.status)}<br><a href="javascript:openModal('${l.id}')">view details</a></div></div>`);
    m.addTo(markersLayer);
    bounds.push([l.lat,l.lng]);
  });
  settleMap();
  if(bounds.length) map.fitBounds(bounds, {padding:[30,30], maxZoom:11});
}

document.getElementById("btnApply").addEventListener("click", ()=>{
  state.county = document.getElementById("fCounty").value;
  state.minAcres = document.getElementById("fMinAcres").value===''?null:+document.getElementById("fMinAcres").value;
  state.maxAcres = document.getElementById("fMaxAcres").value===''?null:+document.getElementById("fMaxAcres").value;
  state.minPrice = document.getElementById("fMinPrice").value===''?null:+document.getElementById("fMinPrice").value;
  state.maxPrice = document.getElementById("fMaxPrice").value===''?null:+document.getElementById("fMaxPrice").value;
  state.status = document.getElementById("fStatus").value;
  render();
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  state.county=""; state.minAcres=2; state.maxAcres=10; state.minPrice=null; state.maxPrice=null; state.status="";
  state.chips=new Set();
  document.querySelectorAll(".chip").forEach(ch=>ch.classList.remove("on"));
  document.getElementById("fCounty").value=""; document.getElementById("fMinAcres").value=2; document.getElementById("fMaxAcres").value=10;
  document.getElementById("fMinPrice").value=""; document.getElementById("fMaxPrice").value=""; document.getElementById("fStatus").value="";
  render();
});
document.querySelectorAll(".chip").forEach(ch=>{
  ch.addEventListener("click", ()=>{
    const k = ch.dataset.chip;
    if(state.chips.has(k)) state.chips.delete(k); else state.chips.add(k);
    ch.classList.toggle("on");
    render();
  });
});
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    const tab = t.dataset.tab;
    document.getElementById("cardList").style.display = tab==="cards"?"":"none";
    document.getElementById("tableList").style.display = tab==="table"?"":"none";
  });
});
function openModal(id){
  const l = DATA.listings.find(x=>x.id===id); if(!l) return;
  const hero = (l.photos && l.photos[0]) || "";
  const heroEl = document.getElementById("modalHero");
  heroEl.src = hero;
  heroEl.style.display = hero ? "" : "none";
  document.getElementById("modalTitle").textContent = `${l.city}, ${l.county} County${l.state==="IA"?" (IA)":""} — ${fmtPrice(l.price)}`;
  document.getElementById("modalRow").innerHTML = `
    <div><b>Acres</b><br>${l.acres??"—"}</div>
    <div><b>Home</b><br>${homeLine(l)}</div>
    <div><b>Status</b><br>${esc(l.status)}</div>
    <div><b>Elevation</b><br>${l.elevation_ft? l.elevation_ft+" ft":"—"}</div>
    <div><b>Agent</b><br>${esc(l.agent||"—")}${l.agent_phone?"<br>"+esc(l.agent_phone):""}</div>
    <div><b>MLS</b><br>${esc(l.mls||"—")}</div>`;
  document.getElementById("modalDesc").textContent = l.desc;
  document.getElementById("modalPhotos").innerHTML = (l.photos||[]).map(p=>`<img src="${esc(p)}" alt="property photo">`).join("");
  const link = document.getElementById("modalLink");
  link.href = l.url; link.textContent = "Open listing ↗";
  document.getElementById("modalBg").classList.add("open");
}
document.getElementById("modalClose").addEventListener("click", ()=>document.getElementById("modalBg").classList.remove("open"));
document.getElementById("modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") document.getElementById("modalBg").classList.remove("open"); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("modalBg").classList.remove("open"); });

initMap();
window.addEventListener("resize", ()=>{ if(map) map.invalidateSize(); });
load().catch(err=>{
  document.getElementById("metaLine").textContent = "Failed to load listings.json: "+err.message;
});
</script>
</body>
</html>
